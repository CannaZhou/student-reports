<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>信息科技·课堂检测</title>
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
<header class="topbar">
  <div class="crest">科</div>
  <div class="tt">信息科技 · 分课课堂检测<small>自动批改 · 逐课记录成绩</small></div>
</header>

<div class="wrap">
  <div class="card panel-title">
    <h1>🌱 三至六年级 · 每课一测</h1>
    <p class="muted">选择你的名字开始答题，交卷后自动批改并记录到这一课的成绩里。</p>
  </div>

  <div class="entry">
    <a href="quiz">
      <div class="card">
        <div class="ico">📝</div>
        <div>
          <h3>开始答题 / 继续做题</h3>
          <p>选名字登录 → 选年级、单元、课 → 在线作答</p>
        </div>
        <div class="go">›</div>
      </div>
    </a>
    <a href="scores">
      <div class="card">
        <div class="ico">📊</div>
        <div>
          <h3>我的成绩</h3>
          <p>查看自己每一课的历史成绩与答题记录</p>
        </div>
        <div class="go">›</div>
      </div>
    </a>
    <a href="teacher">
      <div class="card">
        <div class="ico">👩‍🏫</div>
        <div>
          <h3>教师管理</h3>
          <p>维护班级名单 · 查看各班各课完成情况</p>
        </div>
        <div class="go">›</div>
      </div>
    </a>
  </div>
</div>
</body>
</html>
